# swell configuration (defaults)
# Copy to ~/.config/swell/config.toml and edit; every key is optional.

[runner]
# false turns the module off
enable = true
# move on to the next queued command if one runs longer than this (it keeps running); 0 waits forever
timeout_ms = 10000
# print every command the runner starts to stderr
log = false

# Hooks: when an event matching `on` (a glob, e.g. "window.*") fires, run
# the `run` commands with sh -c, one after another. Hooks run in a single
# queue so their order is kept; `detach = true` starts the commands and
# moves on without waiting. Commands get $SWELL_EVENT and the event's
# details ($SWELL_WORKSPACE, $SWELL_APP_ID, ...). There are none by
# default. Events: see README. For example:
#
#   [[runner.hook]]
#   on = "workspace.occupied"
#   run = ["notify-send \"$SWELL_WORKSPACE\""]
#   detach = true
hook = []

[workspaces]
# false turns the module off
enable = true
# keep workspaces numbered 1..n, renaming them after every change
renumber = true
# wait this long after the last workspace event before renumbering
debounce_ms = 30

[osd]
# false turns the module off
enable = true
# layer-shell namespace of the surface
namespace = "nixosd"
# panel width, logical px
width = 220
# panel height, logical px
height = 260
# panel corner radius (0 = square)
corner = 0
# gap between the top edge (or bar) and the panel
top_gap = 12
# ring centre, px from the panel top
ring_cy = 110
# ring radius
ring_radius = 88
# ring stroke width
ring_width = 10
# snowflake radius, tip to centre
logo_radius = 64
# baseline of the icon + percentage text, px from the panel top
text_baseline = 238
# font family (cairo toy font API)
font = "IosevkaTerm Nerd Font"
# text size
font_size = 22
# panel background
background = "#000000f0"
# 1px panel border
border = "#6a6a6a"
# unfilled ring track
track = "#333333"
# snowflake dark lambdas
nix_dark = "#8c8c8c"
# snowflake light lambdas
nix_light = "#cfcfcf"
# ring gradient, dark end
ring_dark = "#a0a0a0"
# ring gradient, light end
ring_light = "#d6d6d6"
# second lap above 100%, dark end
over_dark = "#eeeeee"
# second lap above 100%, light end
over_light = "#ffffff"
# above 100%: the over-lap, text and logo pulse to this
pulse_light = "#ff3b3b"
# above 100%: pulse colour of the dark end
pulse_dark = "#b81414"
# ring and logo when muted
muted = "#5a5a5a"
# icon and percentage text
text = "#f2f2f2"
# strength of the red tint on the logo above 100%
logo_pulse_alpha = 0.75
# highest accepted level, percent (above 100 starts a second lap)
max_pct = 200
# time after the last update before retracting
hide_timeout_ms = 1200
# level change animation
tween_ms = 260
# drop-down / retract animation
slide_ms = 220
# one red pulse cycle above 100%
pulse_ms = 900

[popup]
# false turns the module off
enable = true
# layer-shell namespace of the surface
namespace = "popup"
# panel width, logical px
width = 560
# tallest panel (with a media row) and the surface height
height = 529
# inner padding of the panel
pad = 36
# gap between the bottom edge (or bar) and the panel
bottom_gap = 12
# font family (cairo toy font API)
font = "IosevkaTerm Nerd Font"
# HH:MM size
font_clock = 112
# :SS size
font_seconds = 30
# date size
font_date = 20
# level, row and workspace strip size
font_row = 18
# compact workspace column size
font_ws = 16
# panel background
background = "#000000f0"
# 1px panel border
border = "#6a6a6a"
# bar tracks and separators
track = "#333333"
# level bar gradient, left end
bar_dark = "#a0a0a0"
# level bar gradient, right end
bar_light = "#d6d6d6"
# main text
text = "#f2f2f2"
# secondary text
dim = "#949494"
# labels, muted and missing values
muted = "#5a5a5a"
# focused workspace cell
ws_focus = "#2e2e2e"
# low battery and urgent workspaces
warn = "#ff3b3b"
# hold line tail (its growing end is the border colour)
hold = "#333333"
# battery at or below this (discharging) is shown in warn
battery_low_pct = 15
# refresh period while shown
refresh_ms = 1000
# kill wpctl/nmcli/playerctl if one is still running after this
command_timeout_ms = 3000
# slide up into place
pop_ms = 220
# slide back down
close_ms = 220
# hold this long to reveal the details
expand_delay_ms = 2000
# clock-only to full panel
expand_ms = 260
# media row opening/closing while expanded
media_ms = 260
# clock baseline to date cap top
gap_date = 28.0
# date baseline to separator
gap_sep = 34.0
# separator to level cap top (and last row to footer)
gap_cols = 34.0
# level baseline to bar top
gap_bar = 14.0
# level bar height
bar_h = 4.0
# bar inset inside each level column
col_inset = 14.0
# bar bottom to first row cap top
gap_rows = 40.0
# row baseline to baseline
row_step = 42.0
# HH:MM to :SS
sec_gap = 4.0
# icon ink to its text
icon_gap = 8.0
# compact-panel level indicator size
mini_font = 15.0
# mini icon ink to its value
mini_gap = 7.0
# workspace strip cell height
ws_h = 32.0
# workspace strip cell minimum width
ws_min_w = 36.0
# text inset each side of a cell
ws_text_pad = 11.0
# gap between strip cells
ws_gap = 2.0
# lower separator to the strip
gap_ws = 26.0
# compact column cell minimum width
wsc_min_w = 30.0
# compact column cell maximum width
wsc_max_w = 92.0
# compact cells inset inside their row
wsc_inset = 2.0
# "more" arrow half-width
wsc_arrow = 4.0
# strip edge room for a "more" arrow
ws_arrow_w = 16.0
# thickness of the line that traces the border until the expand; 0 hides it
hold_h = 1.0

[overview]
# false turns the module off
enable = true
# live window thumbnails (false: outlines only)
capture = true
# keep thumbnails updating (false: capture each once)
live = true
# live thumbnail update rate
fps = 30
# show the "New workspace" slot
new_workspace_slot = true
# pango font description
font = "IosevkaTerm Nerd Font 12"
# margin around the grid (px)
layout_pad = 48.0
# gap between workspace tiles (px)
layout_gap = 36.0
# workspace name row height (px)
label_height = 30.0
# space for the window title at the bottom (px)
caption_height = 56.0
# gap between spread-out tabbed/stacked windows (tree px)
spread_gap = 24.0
# pointer travel that starts a drag (px)
drag_threshold = 8.0
# hover time before the window preview grows
zoom_delay_ms = 250
# preview grow/shrink duration
zoom_anim_ms = 140
# preview width limit, fraction of the output
zoom_max_width = 0.55
# preview height limit, fraction of the output
zoom_max_height = 0.65
# no preview unless it grows at least this much
zoom_min_gain = 1.2
# preview distance from the output edges (px)
zoom_margin = 16.0
# scrim over the whole output
background = "#121217f0"
# workspace tile
tile = "#24242b"
# workspace tile border
tile_border = "#42424d"
# border of a visible (unfocused) workspace
tile_visible = "#8c8c99"
# selection, focused workspace name, drop markers
accent = "#5e9cff"
# urgent workspace name / window border
urgent = "#ed5454"
# window placeholder behind thumbnails
window = "#383845"
# window border
window_border = "#575766"
# hovered window/workspace border
hover = "#ffffffa6"
# text
text = "#ebebf2"
# dim text (labels without thumbnails, +)
text_dim = "#9e9ead"
# border of the focused workspace
focused_border = "#5e9cff73"
# tint of a workspace a window is dragged over
drop_fill = "#5e9cff2e"
# "New workspace" slot fill
new_slot_fill = "#ffffff08"
# "New workspace" slot fill while a window is dragged over it
new_slot_drop_fill = "#5e9cff26"
# shadow under dragged windows/workspaces
shadow = "#00000059"
# each of the 3 shadow rings of the preview
zoom_shadow = "#0000001f"
# title band at the bottom of the preview
zoom_title_band = "#0d0d12c7"
# opacity of a window/workspace while it is dragged away
drag_source_alpha = 0.3
# opacity of the dragged window/workspace under the pointer
drag_ghost_alpha = 0.9

[wallpaper]
# false turns the module off
enable = true
# layer-shell namespace of the surfaces
namespace = "swell-wallpaper"
# frame rate cap at the resting spin (0 = the display rate)
fps = 30
# frame rate cap while the pointer spins the logo faster (0 = the display rate)
fps_spin = 0
# frame rate cap while the visualiser shows (0 = the display rate)
fps_audio = 60
# freeze after this long without input (0 = never)
idle_timeout_s = 300
# battery re-read period while animating
battery_interval_s = 30
# background
background = "#000000"
# battery bar at full pulse brightness
bar = "#ffffff"
# snowflake
logo = "#181818"
# snowflake, every other lambda
logo_alt = "#111111"
# snowflake at the fastest spin (it brightens with the speed)
logo_glow = "#5a5a5a"
# snowflake at the fastest spin, every other lambda
logo_glow_alt = "#444444"
# bar top edge (px on a 2880 px wide output; all sizes scale with the output width)
bar_top = 10.0
# bar length, px
bar_width = 600.0
# bar thickness, px
bar_height = 10.0
# outline width, px
bar_border = 2.0
# gap between the outline and the fill, px
bar_gap = 2.0
# bar brightness between pulses (0..1)
bar_min = 0.0980392
# time between pulses at 50% (scales with the percent)
pulse_period_s = 4.0
# shortest time between pulses (near 0%)
pulse_period_min_s = 0.5
# pulse fade width at 50% (Gaussian sigma)
pulse_sigma_s = 0.4
# time at full brightness per pulse at 50%
pulse_hold_s = 1.0
# fill change animation
tween_ms = 600
# snowflake radius, px
logo_radius = 225.0
# snowflake rotation, degrees/s clockwise
spin_speed = 15.0
# extra speed (x spin_speed) per px of pointer travel
spin_gain = 0.008
# most extra speed (x spin_speed)
spin_max = 100.0
# extra speed decay time constant
spin_decay_s = 1.2
# the extra speed only decays once the pointer has been still this long, so it keeps building while the pointer moves
spin_hold_ms = 200
# fastest the snowflake visibly turns, degrees/s; more speed shows as a bloom and speed lines
spin_visible_max = 200.0
# glow behind the snowflake past spin_visible_max
bloom = "#808080"
# bloom radius at the fastest spin (x logo_radius)
bloom_radius = 1.6
# bloom opacity at the fastest spin
bloom_alpha = 0.25
# speed lines around the snowflake
streak = "#a0a0a0"
# speed lines (0 = none)
streak_count = 9
# speed line length at the fastest spin, degrees
streak_length = 70.0
# speed line thickness, px
streak_width = 5.0
# speed line opacity at the fastest spin
streak_alpha = 0.7
# audio visualiser, along the screen's sides or around the snowflake (PipeWire; only while the wallpaper animates and something plays)
viz = true
# PipeWire sink to visualise (node name or serial; "" = the default sink)
viz_target = ""
# visualiser bars per side (left channel on the left, right on the right)
viz_bars = 48
# bars along the screen's left and right edges, growing inwards; false: a ring around the snowflake
viz_edges = true
# edge bar length at full level, px (needs viz_edges)
viz_edge_length = 600.0
# edge bars' distance from the screen's side, px (needs viz_edges)
viz_edge_gap = 0.0
# space left free above and below the edge bars, px (needs viz_edges)
viz_edge_margin = 0.0
# one smooth filled curve through the levels on each side instead of separate bars (needs viz_edges)
viz_edge_smooth = true
# how far each level spreads over its neighbours in the smooth curve, in bars (0 = through every level exactly; needs viz_edge_smooth)
viz_edge_blur = 1.5
# the smooth curve's fill opacity at full length, as a share of its opacity at the screen's side (1 = flat; needs viz_edge_smooth)
viz_edge_fade = 0.1
# the line along the smooth curve (needs viz_edge_smooth)
viz_edge_rim = "#a0a0a0"
# width of the line along the smooth curve, px (0 = none; needs viz_edge_smooth)
viz_edge_rim_width = 3.0
# the line the ring's bars grow from, both ways (x logo_radius)
viz_radius = 1.6
# ring bar length at full level, both ends together, px
viz_length = 260.0
# share of a ring bar's length that grows inwards (0 = all outwards from viz_radius)
viz_inward = 0.4
# bar thickness, as a fraction of its slot
viz_width = 0.55
# visualiser bars
viz_color = "#5a5a5a"
# visualiser opacity
viz_alpha = 1.0
# lowest frequency (the bottom bars)
viz_low_hz = 50.0
# highest frequency (the top bars)
viz_high_hz = 10000.0
# how fast the bars fall (gravity, full heights per s^2)
viz_fall = 4.0
# how smoothly the bars rise: the time to cover ~63% of a jump, ms (0 = at once)
viz_rise_ms = 40.0
# irregularity: each bar's angle, width, length and gain vary a little (0 = a perfect ring)
viz_jitter = 0.0
# the snowflake's lambdas slide outwards with the music, each by its own slice of the spectrum (needs viz)
react_slide = false
# lambda slide at full level (x logo_radius)
react_slide_dist = 0.1
# the snowflake grows on bass hits (needs viz)
react_pulse = true
# growth per bass hit (x logo_radius)
react_pulse_scale = 0.1
# growth for the softest bass hit, of react_pulse_scale; bigger hits grow more, fully from a 15 dB jump
react_pulse_min = 0.6
# how fast a bass hit eases back
react_pulse_ms = 150
# the snowflake brightens with loudness (needs viz)
react_glow = true
# brightness whenever music plays, of the way to logo_glow; the loudness and spin glow build on top (needs react_glow)
react_glow_base = 0.5
# brightness as the music spins the snowflake: this much of the way to logo_glow at spin_visible_max (needs react_glow and react_spin)
react_glow_spin = 1.0
# brightness at full loudness, of the way to logo_glow
react_glow_amount = 0.6
# loudness and beats speed the snowflake up (needs viz)
react_spin = true
# extra speed at full loudness (x spin_speed)
react_spin_gain = 6.0
# extra speed per beat (x spin_speed)
react_spin_kick = 0.0
# how fast a beat's extra speed eases off
react_spin_kick_ms = 400
# the whole wallpaper shakes on the biggest bass hits (needs viz)
react_shake = true
# how many dB a bass hit must jump to shake (most jump 6-10)
react_shake_rise = 20.0
# shake distance at its start (reference px)
react_shake_px = 14.0
# how fast a shake dies down
react_shake_ms = 200
