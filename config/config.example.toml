# swell configuration (defaults)
# Copy to ~/.config/swell/config.toml and edit; every key is optional.

[runner]
# false turns the module off
enable = true
# move on to the next queued command if one runs longer than this (it keeps running); 0 waits forever
timeout_ms = 10000
# print every command the runner starts to stderr
log = false

# Hooks: when an event matching `on` (a glob, e.g. "window.*") fires, run
# the `run` commands with sh -c, one after another. Hooks run in a single
# queue so their order is kept; `detach = true` starts the commands and
# moves on without waiting. Commands get $SWELL_EVENT and the event's
# details ($SWELL_WORKSPACE, $SWELL_APP_ID, ...). There are none by
# default. Events: see README. For example:
#
#   [[runner.hook]]
#   on = "workspace.occupied"
#   run = ["notify-send \"$SWELL_WORKSPACE\""]
#   detach = true
hook = []

[workspaces]
# false turns the module off
enable = true
# keep workspaces numbered 1..n, renaming them after every change
renumber = true
# wait this long after the last workspace event before renumbering
debounce_ms = 30

[osd]
# false turns the module off
enable = true
# layer-shell namespace of the surface
namespace = "nixosd"
# panel width, logical px
width = 220
# panel height, logical px
height = 260
# panel corner radius (0 = square)
corner = 0
# gap between the top edge (or bar) and the panel
top_gap = 12
# ring centre, px from the panel top
ring_cy = 110
# ring radius
ring_radius = 88
# ring stroke width
ring_width = 10
# snowflake radius, tip to centre
logo_radius = 64
# baseline of the icon + percentage text, px from the panel top
text_baseline = 238
# font family (cairo toy font API)
font = "IosevkaTerm Nerd Font"
# text size
font_size = 22
# panel background
background = "#000000f0"
# 1px panel border
border = "#6a6a6a"
# unfilled ring track
track = "#333333"
# snowflake dark lambdas
nix_dark = "#8c8c8c"
# snowflake light lambdas
nix_light = "#cfcfcf"
# ring gradient, dark end
ring_dark = "#a0a0a0"
# ring gradient, light end
ring_light = "#d6d6d6"
# second lap above 100%, dark end
over_dark = "#eeeeee"
# second lap above 100%, light end
over_light = "#ffffff"
# above 100%: the over-lap, text and logo pulse to this
pulse_light = "#ff3b3b"
# above 100%: pulse colour of the dark end
pulse_dark = "#b81414"
# ring and logo when muted
muted = "#5a5a5a"
# icon and percentage text
text = "#f2f2f2"
# strength of the red tint on the logo above 100%
logo_pulse_alpha = 0.75
# highest accepted level, percent (above 100 starts a second lap)
max_pct = 200
# time after the last update before retracting
hide_timeout_ms = 1200
# level change animation
tween_ms = 260
# drop-down / retract animation
slide_ms = 220
# one red pulse cycle above 100%
pulse_ms = 900

[wsosd]
# false turns the module off
enable = true
# layer-shell namespace of the surface
namespace = "swell-wsosd"
# panel height, logical px
height = 36
# gap between the top edge (or bar) and the panel
top_gap = 12
# panel corner radius (0 = square)
corner = 0
# space left and right of the row of dots
pad = 18
# dot diameter
dot = 8
# space between dots
dot_gap = 12
# length of the focused workspace's bar
active_width = 28
# surface sized for this many workspaces (grows past it)
max_dots = 10
# panel background
background = "#000000f0"
# 1px panel border
border = "#6a6a6a"
# dots of the other workspaces
dot_color = "#5a5a5a"
# focused bar gradient, right end
active_dark = "#a0a0a0"
# focused bar gradient, left end
active_light = "#d6d6d6"
# time after the last workspace change before retracting
hide_timeout_ms = 900
# drop-down / retract animation
slide_ms = 220
# bar sliding to the new workspace, and the panel resizing
move_ms = 200

[popup]
# false turns the module off
enable = true
# layer-shell namespace of the surface
namespace = "popup"
# panel width, logical px
width = 560
# tallest panel and the surface height
height = 484
# inner padding of the panel
pad = 36
# gap between the bottom edge (or bar) and the panel
bottom_gap = 12
# font family (cairo toy font API)
font = "IosevkaTerm Nerd Font"
# HH:MM size
font_clock = 112
# :SS size
font_seconds = 30
# date size
font_date = 20
# level, row and workspace strip size
font_row = 18
# compact workspace column size
font_ws = 16
# panel background
background = "#000000f0"
# 1px panel border
border = "#6a6a6a"
# bar tracks and separators
track = "#333333"
# level bar gradient, left end
bar_dark = "#a0a0a0"
# level bar gradient, right end
bar_light = "#d6d6d6"
# main text
text = "#f2f2f2"
# secondary text
dim = "#949494"
# labels, muted and missing values
muted = "#5a5a5a"
# focused workspace cell
ws_focus = "#2e2e2e"
# low battery and urgent workspaces
warn = "#ff3b3b"
# hold line tail (its growing end is the border colour)
hold = "#333333"
# battery at or below this (discharging) is shown in warn
battery_low_pct = 15
# refresh period while shown
refresh_ms = 1000
# kill wpctl/nmcli if one is still running after this
command_timeout_ms = 3000
# slide up into place
pop_ms = 220
# slide back down
close_ms = 220
# hold this long to reveal the details
expand_delay_ms = 2000
# clock-only to full panel
expand_ms = 260
# clock baseline to date cap top
gap_date = 28.0
# date baseline to separator
gap_sep = 34.0
# separator to level cap top (and last row to footer)
gap_cols = 34.0
# level baseline to bar top
gap_bar = 14.0
# level bar height
bar_h = 4.0
# bar inset inside each level column
col_inset = 14.0
# bar bottom to first row cap top
gap_rows = 40.0
# row baseline to baseline
row_step = 42.0
# HH:MM to :SS
sec_gap = 4.0
# icon ink to its text
icon_gap = 8.0
# compact-panel level indicator size
mini_font = 15.0
# mini icon ink to its value
mini_gap = 7.0
# workspace strip cell height
ws_h = 32.0
# workspace strip cell minimum width
ws_min_w = 36.0
# text inset each side of a cell
ws_text_pad = 11.0
# gap between strip cells
ws_gap = 2.0
# lower separator to the strip
gap_ws = 26.0
# compact column cell minimum width
wsc_min_w = 30.0
# compact column cell maximum width
wsc_max_w = 92.0
# compact cells inset inside their row
wsc_inset = 2.0
# "more" arrow half-width
wsc_arrow = 4.0
# strip edge room for a "more" arrow
ws_arrow_w = 16.0
# thickness of the line that traces the border until the expand; 0 hides it
hold_h = 1.0
# on an empty workspace, show the contents in the wallpaper instead of the panel
wallpaper = true

[media]
# false turns the module off
enable = true
# layer-shell namespace of the surface
namespace = "media"
# panel width, logical px
width = 560
# panel height
height = 160
# gap between the top edge (or bar) and the panel
top_gap = 12
# panel corner radius (0 = square)
corner = 0
# inner padding of the panel
pad = 24
# show the track's cover
art = true
# side of the cover's square
art_size = 112
# font family
font = "IosevkaTerm Nerd Font"
# player name size
font_player = 14
# title size
font_title = 22
# artist/album and status icon size
font_row = 16
# elapsed and total time size
font_time = 13
# panel background
background = "#000000f0"
# 1px panel border
border = "#6a6a6a"
# progress bar track, and the square without a cover
track = "#333333"
# progress bar gradient, left end
bar_dark = "#a0a0a0"
# progress bar gradient, right end
bar_light = "#d6d6d6"
# title and the playing icon
text = "#f2f2f2"
# player, artist/album and times
dim = "#949494"
# paused: the icon, bar and times
muted = "#5a5a5a"
# player baseline to title cap top
gap_title = 12.0
# title baseline to artist cap top
gap_artist = 10.0
# bar bottom to time cap top
gap_time = 8.0
# progress bar height
bar_h = 4.0
# playerctl -p ("": playerctl's pick)
player = ""
# while the popup shows, a playerctl follower that died is restarted within this
interval_ms = 1000
# kill playerctl if it is still running after this
command_timeout_ms = 3000
# drop down into place
slide_ms = 220
# go back up
close_ms = 220
# crossfade on a track change
fade_ms = 200
# no track length: the bar's segment crosses it in this long
chase_ms = 1600
# play/pause: the icon morphs and the colours fade this long
status_ms = 250
# after play-pause, the panel shows this long
flash_ms = 1500

[overview]
# false turns the module off
enable = true
# live window thumbnails (false: outlines only)
capture = true
# keep thumbnails updating (false: capture each once)
live = true
# live thumbnail update rate
fps = 30
# show the "New workspace" slot
new_workspace_slot = true
# pango font description
font = "IosevkaTerm Nerd Font 12"
# margin around the grid (px)
layout_pad = 48.0
# gap between workspace tiles (px)
layout_gap = 36.0
# workspace name row height (px)
label_height = 30.0
# space for the window title at the bottom (px)
caption_height = 56.0
# workspace tile corner radius (px)
tile_radius = 12.0
# space between a tile's edge and its windows (px)
tile_inset = 6.0
# window corner radius (px)
window_radius = 6.0
# gap between windows in a tile (px)
window_gap = 4.0
# gap between spread-out tabbed/stacked windows (tree px)
spread_gap = 24.0
# pointer travel that starts a drag (px)
drag_threshold = 8.0
# hover time before the window preview grows
zoom_delay_ms = 250
# preview grow/shrink duration
zoom_anim_ms = 140
# preview width limit, fraction of the output
zoom_max_width = 0.55
# preview height limit, fraction of the output
zoom_max_height = 0.65
# no preview unless it grows at least this much
zoom_min_gain = 1.2
# preview distance from the output edges (px)
zoom_margin = 16.0
# open/close animation: the shown workspace zooms out of and back into the screen (0 = off)
open_anim_ms = 180
# the wallpaper's topo map under the background (topo style only; the windows hide the real one)
backdrop = true
# scrim over the wallpaper's map
background = "#0b0b10b8"
# scrim without the map (classic wallpaper, backdrop = false); the windows show through what it leaves
background_plain = "#0f0f14f0"
# workspace tile
tile = "#1c1d26"
# workspace tile border
tile_border = "#2e3040"
# border of a visible (unfocused) workspace
tile_visible = "#6c6f85"
# focused workspace name, drop tints
accent = "#89b4fa"
# selection/drop marker gradient, top left
accent_a = "#f5c2e7"
# selection/drop marker gradient, middle
accent_mid = "#fab387"
# selection/drop marker gradient, bottom right
accent_b = "#89b4fa"
# urgent workspace name / window border
urgent = "#ed5454"
# window placeholder behind thumbnails
window = "#2a2c3a"
# window border
window_border = "#ffffff14"
# hovered window/workspace border
hover = "#ffffffa6"
# text
text = "#ebebf2"
# dim text (labels without thumbnails, +)
text_dim = "#8a8ca0"
# border of the focused workspace
focused_border = "#ffffff40"
# tint of a workspace a window is dragged over
drop_fill = "#89b4fa2e"
# "New workspace" slot fill
new_slot_fill = "#ffffff08"
# "New workspace" slot fill while a window is dragged over it
new_slot_drop_fill = "#89b4fa26"
# shadow under dragged windows/workspaces
shadow = "#00000059"
# each of the 3 shadow rings under a tile
tile_shadow = "#00000029"
# each of the 3 shadow rings of the preview
zoom_shadow = "#0000001f"
# title band at the bottom of the preview
zoom_title_band = "#0d0d12c7"
# opacity of a window/workspace while it is dragged away
drag_source_alpha = 0.3
# opacity of the dragged window/workspace under the pointer
drag_ghost_alpha = 0.9

[wallpaper]
# false turns the module off
enable = true
# layer-shell namespace of the surfaces
namespace = "swell-wallpaper"
# frame rate cap at the resting spin (0 = the display rate)
fps = 30
# frame rate cap while the pointer spins the logo faster (0 = the display rate)
fps_spin = 0
# frame rate cap while the visualiser shows (0 = the display rate)
fps_audio = 0
# freeze after this long without input (0 = never)
idle_timeout_s = 300
# the pulsing battery bar at the top
battery_bar = true
# the battery bar keeps pulsing while idle on an empty workspace (the rest stays frozen; an open window freezes it too)
idle_bar_pulse = true
# idle on an empty workspace: the map, bar and title fade out and the snowflake wanders round the screen (burn-in protection; the bar doesn't pulse then)
idle_saver = true
# how fast the idle snowflake wanders, reference px/s
saver_speed = 60.0
# frame rate cap while the idle snowflake wanders (0 = the display rate)
saver_fps = 20
# the snowflake easing off the centre when idle, and back
saver_fade_ms = 1200
# the idle saver covers workspaces with windows open too: it fades in over them (saver_fade_ms) and out on wake
saver_windows = true
# the saver fading off the windows on wake
saver_wake_ms = 300
# battery re-read period while animating
battery_interval_s = 30
# background
background = "#000000"
# battery bar at full pulse brightness
bar = "#ffffff"
# snowflake
logo = "#181818"
# snowflake, every other lambda
logo_alt = "#111111"
# snowflake at the fastest spin (it brightens with the speed)
logo_glow = "#5a5a5a"
# snowflake at the fastest spin, every other lambda
logo_glow_alt = "#444444"
# the look: "topo" (rainbow contour lines, a glass snowflake) or "classic" (black, the solid snowflake)
style = "topo"
# topo background at the left (needs topo)
topo_bg_left = "#000000"
# topo background at the right
topo_bg_right = "#000000"
# contour lines at the left
topo_line_left = "#f5b88a"
# contour lines in the middle
topo_line_mid = "#a6e3a1"
# contour lines at the right
topo_line_right = "#89dcea"
# which contour map (any number)
topo_seed = 7
# a new contour map and colour direction each time swell starts (ignores topo_seed, topo_angle)
topo_new_map = true
# the map's colours run this many degrees clockwise from left to right
topo_angle = 0.0
# contour lines from the lowest ground to the highest
topo_levels = 10
# every this many'th contour line is wider (0 = none)
topo_index_every = 4
# the hills' size, px
topo_scale = 1500.0
# how much the hills meander
topo_warp = 0.9
# contour line width, px
topo_line_width = 3.0
# the wider contour lines' width, x topo_line_width
topo_index_width = 1.5
# contour line opacity
topo_line_alpha = 0.55
# the glass snowflake's fill (its alpha lets the lines show through)
topo_logo_fill = "#2c2f40e0"
# the glass snowflake's fill when it glows (music, spin)
topo_logo_glow = "#3a3e54e0"
# the glass snowflake's outline at the top left
topo_edge_a = "#f5c2e7"
# the glass snowflake's outline across the middle
topo_edge_mid = "#fab387"
# the glass snowflake's outline at the bottom right
topo_edge_b = "#89b4fa"
# the glass snowflake's outline width, px
topo_edge_width = 4.0
# the glass snowflake's fill with a window open (it eases there as the map fades)
topo_window_fill = "#14151c90"
# the outline's opacity with a window open, x its colours' alpha
topo_window_edge_alpha = 0.5
# the outline's width with a window open, px
topo_window_edge_width = 3.0
# the glass snowflake's outline glows past spin_visible_max (topo's bloom; 0 = none)
topo_neon_alpha = 1.0
# that glow's width, px
topo_neon_px = 64.0
# the glass snowflake's shadow, px down and right
topo_shadow_px = 22.0
# the shadow's darkness
topo_shadow_alpha = 0.6
# the map fades out when a window opens on the workspace and back in when the last one goes
topo_fade_ms = 600
# the contour lines move with the music instead of the edge visualiser: bass kicks send rings out from the snowflake, loudness sways them, the spectrum bends and lights them (needs viz and a GPU; without one they stay still)
topo_waves = true
# how far a ring moves the lines at the hardest kick, px
topo_ring_px = 28.0
# a ring's width, px
topo_ring_width = 160.0
# how fast rings spread, px/s
topo_ring_speed = 1600.0
# how long a ring lasts
topo_ring_ms = 1800
# how far the lines sway at full loudness, px
topo_sway_px = 10.0
# moving the pointer over the map parts the lines round it, leaving a wake that closes behind it (needs a GPU)
topo_poke = true
# how far round the pointer the lines are pushed aside, px
topo_poke_radius = 110.0
# the wake is made of points left this far apart, px
topo_poke_spacing = 40.0
# each part of the wake closes this long after the pointer left it, s
topo_poke_close_s = 0.6
# the lines pushed together brighten this much
topo_poke_light = 0.6
# at rest the lines drift slowly round a small loop this far, against burn-in, px (0 = still)
topo_drift_px = 12.0
# one turn of that drift, s
topo_drift_s = 90.0
# the lines round the snowflake bulge out by the spectrum, each angle by its band (bass at the bottom, left channel on the left), this far at full level, px (0 = off)
topo_spectrum_px = 120.0
# how far past the snowflake that bulge fades out, px
topo_spectrum_reach = 500.0
# the spectrum ripples out over the map, the distance from the snowflake picking the band: lines move this far at full level, px (0 = off)
topo_ripple_px = 45.0
# the ripple's bass sits at the snowflake, its treble this far out, px
topo_ripple_span = 1400.0
# the lines brighten with the band of their place along the colour gradient (bass on its left, treble on its right), their alpha gaining up to this x itself (0 = off)
topo_light = 1.5
# and widen by up to this x their width
topo_light_width = 1.0
# how far the lines are drawn in towards the snowflake while the popup key is held (GPU only; on the CPU and in classic a line grows under the clock), px; 0: none
topo_gather_px = 120.0
# how far out from the snowflake that pull fades, px
topo_gather_reach = 700.0
# meanwhile the lines light up from the screen's corners in to the snowflake, reaching it as the details appear (GPU only; as bright as topo_light / topo_light_width make the spectrum's), 0: off
topo_hold_light = 1.0
# title over the map
topo_text = "#f0f0f0"
# artist over the map
topo_text_dim = "#b8b8b8"
# the dark glow behind the title and artist, hiding the lines
topo_text_backdrop = 0.9
# bar top edge (px on a 2880 px wide output; all sizes scale with the output width)
bar_top = 10.0
# bar length, px
bar_width = 600.0
# bar thickness, px
bar_height = 10.0
# outline width, px
bar_border = 2.0
# gap between the outline and the fill, px
bar_gap = 2.0
# bar brightness between pulses (0..1)
bar_min = 0.0980392
# time between pulses at 50% (scales with the percent)
pulse_period_s = 4.0
# shortest time between pulses (near 0%)
pulse_period_min_s = 0.5
# pulse fade width at 50% (Gaussian sigma)
pulse_sigma_s = 0.4
# time at full brightness per pulse at 50%
pulse_hold_s = 1.0
# fill change animation
tween_ms = 600
# snowflake radius, px
logo_radius = 225.0
# snowflake rotation, degrees/s clockwise
spin_speed = 15.0
# extra speed (x spin_speed) per px of pointer travel
spin_gain = 0.008
# most extra speed (x spin_speed)
spin_max = 100.0
# extra speed decay time constant
spin_decay_s = 1.2
# the extra speed only decays once the pointer has been still this long, so it keeps building while the pointer moves
spin_hold_ms = 200
# while the pointer moves over the empty wallpaper, the topo snowflake tips towards it this far, degrees, with the pointer at the screen's edge (needs logo_gpu; 0 = never)
logo_tilt = 18.0
# how far back the outlines layered behind the tipped snowflake reach (x logo_radius)
logo_tilt_depth = 0.15
# outlines layered behind the tipped snowflake (0 = none)
logo_tilt_layers = 4
# the snowflake tips back flat once the pointer has been still this long
logo_tilt_idle_ms = 500
# fastest the snowflake visibly turns, degrees/s; more speed shows as a bloom and speed lines
spin_visible_max = 200.0
# glow behind the snowflake past spin_visible_max (classic; topo: topo_neon_alpha)
bloom = "#808080"
# bloom radius at the fastest spin (x logo_radius)
bloom_radius = 1.6
# bloom opacity at the fastest spin
bloom_alpha = 0.25
# speed lines around the snowflake (classic; topo uses the outline colours)
streak = "#a0a0a0"
# speed lines (0 = none)
streak_count = 9
# speed line length at the fastest spin, degrees
streak_length = 70.0
# speed line thickness, px
streak_width = 5.0
# speed line opacity at the fastest spin
streak_alpha = 0.7
# audio visualiser, along the screen's sides or around the snowflake (PipeWire; only while the wallpaper animates and something plays)
viz = true
# PipeWire sink to visualise (node name or serial; "" = the default sink)
viz_target = ""
# visualiser bars per side (left channel on the left, right on the right)
viz_bars = 48
# bars along the screen's left and right edges, growing inwards; false: a ring around the snowflake
viz_edges = true
# edge bar length at full level, px (needs viz_edges)
viz_edge_length = 600.0
# edge bars' distance from the screen's side, px (needs viz_edges)
viz_edge_gap = 0.0
# space left free above and below the edge bars, px (needs viz_edges)
viz_edge_margin = 0.0
# one smooth filled curve through the levels on each side instead of separate bars (needs viz_edges)
viz_edge_smooth = true
# how far each level spreads over its neighbours in the smooth curve, in bars (0 = through every level exactly; needs viz_edge_smooth)
viz_edge_blur = 1.5
# the smooth curve's fill opacity at full length, as a share of its opacity at the screen's side (1 = flat; needs viz_edge_smooth)
viz_edge_fade = 0.1
# the line along the smooth curve (needs viz_edge_smooth)
viz_edge_rim = "#a0a0a0"
# width of the line along the smooth curve, px (0 = none; needs viz_edge_smooth)
viz_edge_rim_width = 3.0
# draw the smooth edge curve (needs viz_edge_smooth) and the topo map, with its waves, with the GPU (EGL); falls back to the CPU if that fails
viz_gpu = true
# draw the topo snowflake with the GPU too (needs viz_gpu; the CPU still draws it in the launch and power-off animations and while react_slide moves the lambdas)
logo_gpu = true
# the line the ring's bars grow from, both ways (x logo_radius)
viz_radius = 1.6
# ring bar length at full level, both ends together, px
viz_length = 260.0
# share of a ring bar's length that grows inwards (0 = all outwards from viz_radius)
viz_inward = 0.4
# bar thickness, as a fraction of its slot
viz_width = 0.55
# visualiser bars
viz_color = "#5a5a5a"
# visualiser opacity
viz_alpha = 1.0
# lowest frequency (the bottom bars)
viz_low_hz = 50.0
# highest frequency (the top bars)
viz_high_hz = 10000.0
# how fast the bars fall (gravity, full heights per s^2)
viz_fall = 4.0
# how smoothly the bars rise: the time to cover ~63% of a jump, ms (0 = at once)
viz_rise_ms = 40.0
# irregularity: each bar's angle, width, length and gain vary a little (0 = a perfect ring)
viz_jitter = 0.0
# the snowflake's lambdas slide outwards with the music, each by its own slice of the spectrum (needs viz)
react_slide = false
# lambda slide at full level (x logo_radius)
react_slide_dist = 0.1
# the snowflake grows on bass hits (needs viz)
react_pulse = true
# growth per bass hit (x logo_radius)
react_pulse_scale = 0.1
# growth for the softest bass hit, of react_pulse_scale; bigger hits grow more, fully from a 15 dB jump
react_pulse_min = 0.6
# how fast a bass hit eases back
react_pulse_ms = 150
# the snowflake brightens with loudness (needs viz)
react_glow = true
# brightness whenever music plays, of the way to logo_glow; the loudness and spin glow build on top (needs react_glow)
react_glow_base = 0.5
# brightness as the music spins the snowflake: this much of the way to logo_glow at spin_visible_max (needs react_glow and react_spin)
react_glow_spin = 1.0
# brightness at full loudness, of the way to logo_glow
react_glow_amount = 0.6
# loudness and beats speed the snowflake up (needs viz)
react_spin = true
# extra speed at full loudness (x spin_speed)
react_spin_gain = 6.0
# extra speed per beat (x spin_speed)
react_spin_kick = 0.0
# how fast a beat's extra speed eases off
react_spin_kick_ms = 400
# the whole wallpaper shakes on the biggest bass hits (needs viz)
react_shake = true
# how many dB a bass hit must jump to shake (most jump 6-10)
react_shake_rise = 20.0
# shake distance at its start (reference px)
react_shake_px = 14.0
# how fast a shake dies down
react_shake_ms = 200
# show what's playing (playerctl): the title and artist under the snowflake, its progress on the lambdas
media = true
# playerctl player to follow (its -p; "" = playerctl's pick)
media_player = ""
# while the wallpaper animates, a playerctl follower that died is restarted within this
media_interval_ms = 2000
# a line runs clockwise round the snowflake's hexagonal hole from its top as the track plays
media_progress = true
# the progress line (classic; topo uses the outline's colours)
media_line = "#b4b4b4"
# the rest of the hexagon's border (classic; topo: the outline's colours, as faint)
media_track = "#262626"
# the progress line's width, px (0 = no line)
media_line_width = 6.0
# the track's cover, in grey, fills the hexagon (file:// covers are read directly, http(s) ones fetched with curl)
media_art = true
# the cover's opacity
media_art_alpha = 0.5
# the hexagon's size, of the snowflake's hole
media_hex_size = 0.9
# show the title and artist under the snowflake (false: only the cover and progress)
media_title = true
# font of the title and artist
media_font = "IosevkaTerm Nerd Font"
# title size, px
media_title_size = 44.0
# artist size, px
media_artist_size = 32.0
# title
media_text = "#8a8a8a"
# artist
media_dim = "#5a5a5a"
# space between the snowflake (at its biggest pulse) and the title, px
media_gap = 70.0
# widest title or artist, px (longer ones end in an ellipsis)
media_max_width = 1400.0
# how long the details take to fade in or out
media_fade_ms = 400
# opacity of the details and the hexagon while paused
media_paused_alpha = 0.5
# font of the popup's contents, shown in the wallpaper on an empty workspace (popup's `wallpaper`)
peek_font = "IosevkaTerm Nerd Font"
# their clock, px
peek_clock_size = 220.0
# its seconds, px
peek_seconds_size = 72.0
# the date, px
peek_date_size = 52.0
# levels, network, stats and workspaces, px
peek_row_size = 40.0
# widest column each side of the snowflake, px
peek_max_width = 720.0
# how far they slide in from the sides as they show, px
peek_slide = 60.0
# the line that grows under the clock while the key is held, px (0: none)
peek_hold_width = 4.0
# low battery and urgent workspaces
peek_warn = "#ff5a5a"
# "side": while the key is held the snowflake moves right and grows, and the details stack in a column on the left; "flanks": they stay either side of it; "terrain": the map tips into a landscape seen in perspective, the snowflake hovering over a summit, the clock standing up as a sign and CPU, memory and battery as mesas (needs the GPU snowflake, viz_gpu and logo_gpu; else side)
peek_layout = "terrain"
# side: the snowflake's centre, share of the width
peek_side_x = 0.76
# side: and of the height
peek_side_y = 0.53
# side: its size there (x logo_radius; it may run off the screen)
peek_side_scale = 4.0
# side: the contour lines dimmed this much
peek_side_dim = 0.8
# side: widest column, px
peek_side_width = 1100.0
# side: the column's distance from the left edge, px
peek_side_margin = 240.0
# terrain: the camera tipped this far from straight down, deg
peek_terrain_pitch = 56.0
# terrain: and turned this far about the middle, deg
peek_terrain_yaw = 8.0
# terrain: its distance from the middle, x the screen's height (less: stronger perspective)
peek_terrain_focal = 1.6
# terrain: the map's lowest to highest point, px
peek_terrain_height = 380.0
# terrain: the far lines fade over this, x the screen's height
peek_terrain_fog = 1.0
# terrain: the hill raised under the snowflake, x the map's height
peek_terrain_summit = 0.6
# terrain: its radius, px
peek_terrain_summit_r = 520.0
# terrain: the snowflake over its top, px
peek_terrain_hover = 260.0
# terrain: HH:MM, standing on the ground as a glass sign, px
peek_terrain_clock_size = 300.0
# terrain: how thick its glass is, px (0: a sheet)
peek_terrain_clock_depth = 24.0
# terrain: its foot's middle from the screen's, px right
peek_terrain_clock_x = -560.0
# terrain: and px towards the camera
peek_terrain_clock_y = 470.0
# terrain: the CPU, memory and battery mesas' radius, px (one contour up the side per 10%)
peek_terrain_mesa_r = 90.0
# terrain: the first's centre from the middle, px right
peek_terrain_mesa_x = 360.0
# terrain: and px towards the camera
peek_terrain_mesa_y = 470.0
# terrain: from one mesa to the next, px right
peek_terrain_mesa_gap = 300.0
# terrain: the slopes facing the light filled this much
peek_terrain_shade = 0.06
# when the daemon is restarted (run again, e.g. by `exec_always` on a sway reload) the old map's lines fade out and the new one's fade in, each this long; the snowflake stays
handover_ms = 500
# launch animation when the daemon starts on an empty workspace (once per login): classic, the lambdas fly in and lock together; topo, shock or rise, each as likely (as long as classic's)
intro = true
# each lambda's flight
intro_ms = 1100
# between one lambda's start and the next one's
intro_stagger_ms = 90
# where the lambdas start, in logo radii from the centre
intro_dist = 4.0
# the snowflake turns this many degrees into place as they fly in
intro_turn = 120.0
# power-off animation (`swell power off`) on an empty workspace: classic, the lambdas scatter (or the CRT); topo, one of drain, sink and blast, each as likely
outro = true
# the power-off's length (all but classic's CRT), black by its end
outro_ms = 1800
# classic: chance of an old CRT's collapse instead of the scatter
outro_crt_chance = 0.15
# the CRT collapse's length
outro_crt_ms = 1500
# the screen stays black this long after a power-off animation, then the wallpaper comes back (if the system is still up)
outro_hold_ms = 5000
# the CRT's dot and line
crt_color = "#e8f0ff"

[power]
# false turns the module off
enable = true

[wsfade]
# off unless true
enable = false
# layer-shell namespace of the overlay
namespace = "swell-wsfade"
# the old workspace fading out
fade_ms = 160
# how far the old workspace moves while it fades, logical px
drift_px = 60
# switch without a fade if the snapshot takes longer than this
snapshot_timeout_ms = 50

[gestures]
# false turns the module off
enable = true
# fingers a swipe takes (0: any number)
fingers = 3
# how far a swipe must move, in 1/1000 inch on the touchpad
threshold = 300.0
# also run under sway and niri (they bind swipes themselves)
always = false
# a swell command ("ws next"), "exec CMD" for a shell command, or empty
swipe_left = "ws next"
# as swipe_left
swipe_right = "ws prev"
# as swipe_left
swipe_up = "overview open"
# as swipe_left
swipe_down = "overview close"

[lowbat]
# false turns the module off
enable = true
# layer-shell namespace of the surface
namespace = "swell-lowbat"
# discharging at or below this: a short warning
low_pct = 15
# discharging at or below this: a warning that stays until AC
critical_pct = 5
# how often the battery is read
interval_s = 30
# panel width, logical px
width = 300
# panel height, logical px
height = 52
# gap between the top edge (or bar) and the panel
top_gap = 12
# panel corner radius (0 = square)
corner = 0
# space left of the battery and before the text
pad = 18
# battery outline width
body_width = 44
# battery outline height
body_height = 22
# battery terminal width
nub_width = 4
# battery terminal height
nub_height = 10
# font family of the text
font = "IosevkaTerm Nerd Font"
# text size
font_size = 20
# panel background
background = "#000000f0"
# 1px panel border
border = "#6a6a6a"
# empty part of the battery
track = "#333333"
# text and battery outline between pulses
text = "#f2f2f2"
# level fill, and text/outline at a pulse peak
pulse_light = "#ff3b3b"
# level fill's left end between pulses
pulse_dark = "#b81414"
# time the low warning stays before retracting
low_timeout_ms = 6000
# drop-down / retract animation
slide_ms = 220
# one red pulse
pulse_ms = 900
# pulses after dropping down; then the panel holds still
pulse_count = 3

[inhibit]
# false turns the module off
enable = true
# serve org.freedesktop.ScreenSaver on the session bus, so browsers and video players playing a video keep the screensaver away
dbus = true
